spring:
  application:
    name: vitalsafe-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/vitalsafe_db}
    username: ${DB_USER:vitalsafe_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only checks it
    open-in-view: false
    show-sql: false        # never log SQL that could contain health data
  flyway:
    enabled: true

server:
  port: 8090
  # Behind a reverse proxy, use the client address it reports. Tomcat only trusts this header
  # from internal addresses, so it cannot be spoofed from the internet.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health    # nothing else is exposed
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}     # base64, at least 32 bytes, supplied by the environment
    expiration-ms: 900000     # access tokens last 15 minutes
  refresh:                    # NEW
    expiration-days: 7
    cookie-secure: false      # true in production (HTTPS only)
  rate-limit:                 # NEW
    per-minute: 5             # login and registration attempts per client address
  consent:
    version: "2026-11-01"     # version of the privacy notice users accept
  cors:
    allowed-origin: http://localhost:5173