name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: No secret files are tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[a-z]+|.*\.pem|.*\.key)$' | grep -vE '\.example$'; then
            echo "A secret-looking file is tracked by Git"
            exit 1
          fi

      - name: Required files exist
        run: |
          for f in README.md .gitignore .gitattributes docker-compose.yml .env.example; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Compose file is valid
        run: docker compose config -q
        env:
          DB_PASSWORD: ci-dummy

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Docker is preinstalled on GitHub's Ubuntu runners, so Testcontainers works
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 7
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly what package-lock.json says
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Type check and build
        run: npm run build
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Start the test database
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install the Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
  docker:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Build the backend image
        run: docker build -t vitalsafe-backend ./backend

      - name: Build the frontend image
        run: docker build -t vitalsafe-web ./frontend

      - name: The backend runs as a non-root user
        run: |
          user=$(docker run --rm --entrypoint id vitalsafe-backend -u)
          test "$user" != "0" || { echo "The backend runs as root"; exit 1; }

      - name: The proxy configuration is valid
        run: docker run --rm -e DOMAIN=localhost vitalsafe-web caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile