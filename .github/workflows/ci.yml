name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: No secret files are tracked
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.env\.[a-z]+|.*\.pem|.*\.key)$' | grep -vE '\.example$'; then
            echo "A secret-looking file is tracked by Git"
            exit 1
          fi

      - name: Required files exist
        run: |
          for f in README.md .gitignore .gitattributes docker-compose.yml .env.example; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

      - name: Compose file is valid
        run: docker compose config -q
        env:
          DB_PASSWORD: ci-dummy

  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      # Docker is preinstalled on GitHub's Ubuntu runners, so Testcontainers works
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          retention-days: 7