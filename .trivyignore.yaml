vulnerabilities:
  - id: CVE-2026-78661
    statement: >
      Found in the caddy binary of the official caddy:2-alpine image (golang.org/x/net v0.60.0, fixed in 0.62.0).
      A denial of service in the x/net HTML parser. This stack only serves static files and proxies requests,
      so it is not known to be reachable, but that has not been proven. Revisit when the Caddy image is rebuilt
      upstream, or at the expiry date.
    expired_at: 2026-12-11