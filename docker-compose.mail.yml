name: vitalsafe-mail

# A fake mail server for development: it catches every email and shows it at http://localhost:8025.
# Nothing is ever sent to the internet. The image uses "latest" for now, so pin its version once it works.
services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: vitalsafe-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20