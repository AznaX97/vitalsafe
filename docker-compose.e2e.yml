name: vitalsafe-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vitalsafe_e2e
      POSTGRES_USER: vitalsafe_e2e
      POSTGRES_PASSWORD: e2e_password
    # Kept in memory: every run starts with an empty database
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalsafe_e2e -d vitalsafe_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches the emails the backend sends, so the tests can read the reset link
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1125:1025"
      - "127.0.0.1:8125:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30