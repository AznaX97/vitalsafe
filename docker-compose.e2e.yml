name: vitalsafe-e2e

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vitalsafe_e2e
      POSTGRES_USER: vitalsafe_e2e
      POSTGRES_PASSWORD: e2e_password
    # Kept in memory: every run starts with an empty database
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "127.0.0.1:5443:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalsafe_e2e -d vitalsafe_e2e"]
      interval: 2s
      timeout: 3s
      retries: 30